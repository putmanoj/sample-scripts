# version: '3.8'

services:
  # NGINX Reverse Proxy Face
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      # Exposes your custom host ports to the matching internal container ports
      - "${VSPHERE_PROXY_HTTP_PORT}:${VSPHERE_PROXY_HTTP_PORT}"
      - "${VSPHERE_PROXY_HTTPS_PORT}:${VSPHERE_PROXY_HTTPS_PORT}"
    environment:
      # Hands off variables from your local .env file straight into the NGINX template engine
      - VSPHERE_PROXY_HTTP_PORT=${VSPHERE_PROXY_HTTP_PORT}
      - VSPHERE_PROXY_HTTPS_PORT=${VSPHERE_PROXY_HTTPS_PORT}
    volumes:
      # Mount your config file to the templates directory to trigger the auto-substitution
      - ./nginx-default.conf.template:/etc/nginx/templates/default.conf.template:ro

      - ./nginx-whitelist_ips.conf:/etc/nginx/conf.d/whitelist_ips.conf:ro
      - ./nginx-whitelist_domains.conf:/etc/nginx/conf.d/whitelist_domains.conf:ro
      - ./nginx-index.html:/usr/share/nginx/html/index.html:ro
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      - vcsim-service
    restart: always

  # VMware vCenter Server 8.0 Simulator
  vcsim-service:
    image: vmware/vcsim:latest
    container_name: vmware-vcsim
    command: ["-l", ":8989", "-api-version", "8.0", "-load", "/data/vcsim/saved-state"]
    volumes:
      - ./vcsim-data:/data/vcsim
