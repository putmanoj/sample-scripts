version: '3.8'

services:
  # NGINX Reverse Proxy Face
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./whitelist_ips.conf:/etc/nginx/conf.d/whitelist_ips.conf:ro
      - ./whitelist_domains.conf:/etc/nginx/conf.d/whitelist_domains.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      - vcsim-service
    restart: always

  # API Container 3: VMware vCenter Simulator
  vcsim-service:
    image: vmware/vcsim:latest
    container_name: vmware-vcsim
    # Crucial: Tells vcsim to accept external network traffic on port 8989
    command: ["-l", ":8989"]
    restart: always
