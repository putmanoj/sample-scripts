# --- Allowed IP Addresses & Subnets ---
allow 127.0.0.1;           # Host loopback
allow 192.168.0.0/16;      # Common home/office LAN subnets
allow 10.0.0.0/8;          # Enterprise standard private subnets

allow 9.43.68.207;         # My laptop ip

# Note: - check in logs for ip
#
#   docker logs nginx-proxy --tail 20
#
# Look for the entry corresponding to your curl request. It will pinpoint the exact reason:
#  * Scenario A (IP Blocked): You will see access forbidden by rule, client: X.X.X.X
#  * Scenario B (Domain Map Blocked): You will see an entry matching GET / HTTP/1.1" 403 but no "forbidden by rule" error.
#
allow 172.18.0.0/12;       # Standard Docker bridge allocations

# --- Drop Action ---
deny all;                  # Block external unlisted network scanners
